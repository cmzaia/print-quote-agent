[project]
name = "print-quote-agent"
version = "0.1.0"
description = "Conversational print-quote agent: the LLM extracts and orchestrates, a deterministic cost engine does all the math."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
quote = "print_quote_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print_quote_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
